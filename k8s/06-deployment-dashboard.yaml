apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-model-finder-dashboard
  namespace: hf-model-finder
  labels:
    app: hf-model-finder
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hf-model-finder
      component: dashboard
  template:
    metadata:
      labels:
        app: hf-model-finder
        component: dashboard
    spec:
      # The image runs as the unprivileged `app` user (uid 1000); refuse to
      # start if that ever changes. fsGroup makes the PVC group-writable for it
      # on volume types that support ownership changes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dashboard
          image: hf-model-finder:latest
          # Local-only: the image is side-loaded with `minikube image load`,
          # never pulled. On a real cluster this becomes a registry reference
          # with a pull policy to match. Because the tag is fixed at :latest,
          # `kubectl apply` alone will not pick up a rebuild — the spec is
          # unchanged, so nothing restarts. `make k8s-apply` therefore ends
          # with an explicit `kubectl rollout restart` of both Deployments.
          imagePullPolicy: Never
          args: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: hf-model-finder-config
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hf-model-finder-secrets
                  key: APP_PASSWORD
                  optional: true
          volumeMounts:
            - name: state
              mountPath: /app/state
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured at ~70Mi (cgroup memory) with a near-empty monitoring DB;
          # the 384Mi limit leaves room for the DB and pandas frames to grow
          # (an earlier build peaked at ~180Mi).
          # CPU, measured in the container: idle ~1.5% of a core; a page render
          # reads at most 200 rows (~15 CPU-ms plus Streamlit's own work), and
          # the one-time pandas import is ~2 CPU-seconds. 50m request / 250m
          # limit covers that with room to spare.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: hf-model-finder-state
