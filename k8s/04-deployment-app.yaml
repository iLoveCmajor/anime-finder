apiVersion: apps/v1
kind: Deployment
metadata:
  name: anime-finder-app
  namespace: anime-finder
  labels:
    app: anime-finder
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anime-finder
      component: app
  template:
    metadata:
      labels:
        app: anime-finder
        component: app
    spec:
      containers:
        - name: app
          image: anime-finder:latest
          # Local-only: the image is side-loaded with `minikube image load`,
          # never pulled. On a real cluster this becomes a registry reference
          # with a pull policy to match. Because the tag is fixed at :latest,
          # `kubectl apply` alone will not pick up a rebuild — the spec is
          # unchanged, so nothing restarts. `make k8s-apply` therefore ends
          # with an explicit `kubectl rollout restart` of both Deployments.
          imagePullPolicy: Never
          args: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: anime-finder-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anime-finder-secrets
                  key: OPENAI_API_KEY
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anime-finder-secrets
                  key: APP_PASSWORD
                  optional: true
          volumeMounts:
            - name: state
              mountPath: /app/state
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured on Minikube: the app sits at ~470Mi resident once the ONNX
          # model and the index are loaded, so the original 512Mi limit left
          # ~8% headroom and would OOMKill under concurrent queries.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: anime-finder-state
