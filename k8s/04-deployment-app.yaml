apiVersion: apps/v1
kind: Deployment
metadata:
  name: hf-model-finder-app
  namespace: hf-model-finder
  labels:
    app: hf-model-finder
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hf-model-finder
      component: app
  template:
    metadata:
      labels:
        app: hf-model-finder
        component: app
    spec:
      containers:
        - name: app
          image: hf-model-finder:latest
          # Local-only: the image is side-loaded with `minikube image load`,
          # never pulled. On a real cluster this becomes a registry reference
          # with a pull policy to match. Because the tag is fixed at :latest,
          # `kubectl apply` alone will not pick up a rebuild — the spec is
          # unchanged, so nothing restarts. `make k8s-apply` therefore ends
          # with an explicit `kubectl rollout restart` of both Deployments.
          imagePullPolicy: Never
          args: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: hf-model-finder-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hf-model-finder-secrets
                  key: OPENAI_API_KEY
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hf-model-finder-secrets
                  key: APP_PASSWORD
                  optional: true
          volumeMounts:
            - name: state
              mountPath: /app/state
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured on Minikube: the app sits at ~420-455Mi (cgroup memory)
          # once the ONNX model and the 3,613-model index are loaded and a
          # query has run, so a 512Mi limit would leave ~10% headroom and risk
          # an OOMKill under concurrent queries; 1Gi keeps a safe margin.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: hf-model-finder-state
