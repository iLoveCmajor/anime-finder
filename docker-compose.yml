services:
  app:
    build: .
    image: hf-model-finder:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/state/monitoring.db
    volumes:
      - monitoring_state:/app/state
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0"]

  dashboard:
    # Same image as the app, built once by the app service.
    image: hf-model-finder:latest
    pull_policy: never
    ports:
      - "8502:8501"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/state/monitoring.db
    volumes:
      - monitoring_state:/app/state
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0"]
    depends_on:
      - app

volumes:
  monitoring_state:
