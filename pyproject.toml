[project]
name = "hf-model-finder"
version = "0.1.0"
description = "Semantic search + RAG over Hugging Face Hub model cards: describe an ML task, get matched to a pretrained model"
readme = "README.md"
authors = [
    { name = "Vladimir Lopatkin", email = "vlopatkinv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "minsearch>=0.2.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "openai>=3.6.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "tokenizers>=0.23.1",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    { include-group = "ingest" },
    "jupyter>=1.1.1",
]
# Offline data pipeline only (ingest.py, download.py, pull_sample.py). The
# app never calls the Hub at runtime, and the image runs `uv sync --no-dev`.
ingest = [
    "huggingface-hub>=1.29.0",
]
