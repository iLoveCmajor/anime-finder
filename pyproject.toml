[project]
name = "hf-model-finder"
version = "0.1.0"
description = "Semantic search + RAG over Hugging Face Hub model cards: describe an ML task, get matched to a pretrained model"
readme = "README.md"
authors = [
    { name = "Vladimir Lopatkin", email = "vlopatkinv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "minsearch>=0.2.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "openai>=3.6.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "tokenizers>=0.23.1",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    { include-group = "ingest" },
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
# Used directly only by the offline data pipeline (ingest.py, download.py,
# pull_sample.py); the app never calls the Hub. It still reaches the image
# as a transitive dependency of tokenizers.
ingest = [
    "huggingface-hub>=1.29.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
